<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тетрис · ЛЮТЫЙ</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #050520;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Segoe UI', monospace;
  color: #fff;
  overflow: hidden;
}
#bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
#game-wrapper {
  display: flex;
  gap: 24px;
  align-items: flex-start;
  position: relative;
  z-index: 1;
}
#game-wrapper.shake { animation: shake 0.3s; }
@keyframes shake {
  0%, 100% { transform: translate(0,0); }
  20% { transform: translate(-12px, 4px); }
  40% { transform: translate(10px, -6px); }
  60% { transform: translate(-8px, -4px); }
  80% { transform: translate(6px, 6px); }
}
#sidebar {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-width: 160px;
}
.panel {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  padding: 16px;
  backdrop-filter: blur(6px);
}
.panel h3 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: #888;
  margin-bottom: 8px;
}
.panel .value {
  font-size: 28px;
  font-weight: bold;
  color: #0ff;
  text-shadow: 0 0 12px rgba(0,255,255,0.8);
}
#score.pulse { animation: pulse 0.4s; }
@keyframes pulse { 50% { transform: scale(1.5); } }
.panel .value.gold { color: #ff0; text-shadow: 0 0 16px rgba(255,255,0,0.9); }
#next-canvas {
  display: block;
  margin: 0 auto;
}
#stage { position: relative; }
#board-canvas {
  border: 2px solid rgba(0,255,255,0.3);
  border-radius: 8px;
  box-shadow: 0 0 40px rgba(0,255,255,0.2), 0 0 120px rgba(0,255,255,0.08);
}
#board-canvas.glow {
  animation: boardGlow 0.6s;
}
@keyframes boardGlow {
  0% { box-shadow: 0 0 60px rgba(255,0,255,0.9), 0 0 200px rgba(255,0,255,0.6); filter: brightness(2); }
  100% { box-shadow: 0 0 40px rgba(0,255,255,0.2), 0 0 120px rgba(0,255,255,0.08); filter: brightness(1); }
}
#stage { transform-origin: 150px 300px; will-change: transform, filter; }
#rowflash {
  position: absolute;
  left: 2px;
  right: 2px;
  height: 30px;
  background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,0.9), rgba(255,255,255,0));
  box-shadow: 0 0 40px rgba(255,255,255,0.8), 0 0 90px rgba(255,0,255,0.5);
  pointer-events: none;
  opacity: 0;
  z-index: 5;
}
#vignette {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 6;
  background: radial-gradient(circle at center, rgba(0,0,0,0) 30%, rgba(0,0,0,0.92) 100%);
  opacity: 0;
}
#flash {
  position: absolute;
  inset: -6px;
  border-radius: 12px;
  background: rgba(255,255,255,0.9);
  opacity: 0;
  pointer-events: none;
}
#flash.on { animation: flashanim 0.4s; }
@keyframes flashanim {
  0% { opacity: 0.95; }
  100% { opacity: 0; }
}
#textfx {
  position: absolute;
  top: 0; left: 0; right: 0;
  text-align: center;
  font-size: 44px;
  font-weight: bold;
  pointer-events: none;
  color: #ff0;
  opacity: 0;
  z-index: 5;
  font-family: 'Arial Black', sans-serif;
  text-shadow: 0 0 20px rgba(255,255,0,0.9);
}
#textfx.show { animation: textpop 1s forwards; }
@keyframes textpop {
  0% { opacity: 0; transform: scale(0.3) translateY(0); }
  20% { opacity: 1; transform: scale(1.4); }
  50% { opacity: 1; transform: scale(1) translateY(20px); }
  100% { opacity: 0; transform: scale(1.3) translateY(80px); }
}
#overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.85);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 10;
  gap: 20px;
  backdrop-filter: blur(4px);
}
#overlay.hidden { display: none; }
.hidden { display: none !important; }
#overlay h1 {
  font-size: 52px;
  background: linear-gradient(90deg, #f0f, #0ff, #ff0, #f0f);
  background-size: 400% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: rainbow 3s linear infinite;
  filter: drop-shadow(0 0 20px rgba(255,0,255,0.6));
}
@keyframes rainbow { 0% { background-position: 0% 0; } 100% { background-position: 400% 0; } }
#overlay p { font-size: 18px; color: #aaa; }
#overlay .final-score { font-size: 40px; color: #ff0; text-shadow: 0 0 20px rgba(255,255,0,0.8); }
#overlay .combo-hit { font-size: 16px; color: #f0f; text-shadow: 0 0 10px rgba(255,0,255,0.8); }
.controls {
  margin-top: 10px;
  font-size: 12px;
  color: #666;
  line-height: 1.8;
}
.controls kbd {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 4px;
  padding: 2px 6px;
  font-family: inherit;
}
.btn {
  padding: 14px 40px;
  font-size: 20px;
  font-weight: bold;
  background: linear-gradient(90deg, #f0f, #0ff);
  color: #fff;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  font-family: inherit;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 0 30px rgba(255,0,255,0.5);
}
.btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 60px rgba(0,255,255,0.8);
}

#scanlines {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 1px, transparent 1px 3px);
  mix-blend-mode: overlay;
}
#scanlines.boost { animation: scanboost 0.6s; }
@keyframes scanboost {
  0% { opacity: 1; }
  50% { opacity: 0.2; }
  100% { opacity: 1; }
}
#floats {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 6;
  overflow: hidden;
}
.f-float {
  position: absolute;
  transform: translateX(-50%);
  font-family: 'Arial Black', sans-serif;
  font-size: 22px;
  color: #fff;
  text-shadow: 0 0 12px currentColor, 0 0 40px currentColor;
  animation: floatup 1.1s ease-out forwards;
  white-space: nowrap;
}
.f-float.rainbow { color: #ff0; }
.f-float.big { font-size: 42px; }
@keyframes floatup {
  0% { opacity: 0; transform: translate(-50%, 10px) scale(0.4) rotate(-8deg); }
  15% { opacity: 1; transform: translate(-50%, -10px) scale(1.4) rotate(3deg); }
  30% { transform: translate(-50%, -25px) scale(1) rotate(-2deg); }
  100% { opacity: 0; transform: translate(-50%, -110px) scale(1.1) rotate(4deg); }
}
#board-fx {
  position: absolute;
  inset: -4px;
  border-radius: 12px;
  padding: 3px;
  background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
  background-size: 400% 100%;
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  animation: borderwave 3s linear infinite;
  opacity: 0.5;
  pointer-events: none;
}
#board-fx.intense { opacity: 1; }
@keyframes borderwave {
  0% { background-position: 0% 0; }
  100% { background-position: 400% 0; }
}
#lightning {
  position: absolute;
  inset: -10px;
  border-radius: 14px;
  pointer-events: none;
  opacity: 0;
  z-index: 3;
  box-shadow: 0 0 30px 8px rgba(255,255,255,0.8), inset 0 0 60px rgba(0,255,255,0.9);
}
#lightning.zz { animation: lzap 0.35s; }
@keyframes lzap {
  0% { opacity: 1; }
  60% { opacity: 0.5; }
  100% { opacity: 0; }
}
#bar-ar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 6px;
  z-index: 3;
  background: linear-gradient(90deg, #f0f, #0ff, #ff0, #0f0, #f0f);
  background-size: 400% 100%;
  animation: borderwave 1.5s linear infinite;
  opacity: 0.7;
  pointer-events: none;
}
#rgbflash {
  position: fixed;
  inset: 0;
  z-index: 9;
  pointer-events: none;
  opacity: 0;
  mix-blend-mode: screen;
}
#rgbflash.on { animation: rgb 0.35s; }
@keyframes rgb {
  0% {
    opacity: 1;
    box-shadow: inset -40px 0 120px -30px rgba(255,0,80,0.95), inset 40px 0 120px -30px rgba(0,255,255,0.95), inset 0 0 120px rgba(255,255,0,0.5);
    filter: saturate(6);
  }
  100% { opacity: 0; box-shadow: none; filter: saturate(1); }
}
#game-wrapper.hit { animation: hitpunch 0.3s; }
@keyframes hitpunch {
  0% { transform: scale(1.08) rotate(-1.2deg); filter: brightness(1.7) saturate(2); }
  60% { transform: scale(0.99) rotate(0.6deg); }
  100% { transform: scale(1) rotate(0); filter: none; }
}
#game-wrapper.zz-scale { animation: zoomflash 0.4s; }
@keyframes zoomflash {
  0% { transform: scale(0.9); filter: brightness(2) contrast(1.4); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}
body.sick { animation: sickflash 0.5s; }
@keyframes sickflash {
  0% { filter: hue-rotate(180deg) saturate(5) brightness(1.5); }
  100% { filter: none; }
}

#menu {
  position: fixed;
  left: 16px;
  top: 16px;
  width: 250px;
  background: rgba(8, 8, 35, 0.92);
  border: 1px solid rgba(0, 255, 255, 0.35);
  border-radius: 12px;
  padding: 12px;
  z-index: 8;
  font-size: 13px;
  box-shadow: 0 0 25px rgba(0, 255, 255, 0.15);
  backdrop-filter: blur(6px);
}
#menu label { color: #8ff; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; display: block; margin: 6px 0 3px; }
#menu input[type="text"] {
  width: 100%;
  padding: 6px 8px;
  border-radius: 6px;
  border: 1px solid rgba(0, 255, 255, 0.3);
  background: rgba(0, 0, 0, 0.4);
  color: #fff;
  font-family: inherit;
  outline: none;
}
#menu input[type="text"]:focus { border-color: #0ff; box-shadow: 0 0 8px rgba(0,255,255,0.5); }
#menu .row { display: flex; gap: 6px; margin: 8px 0; }
#menu .mrow { display: grid; grid-template-columns: 1fr auto; gap: 6px; margin: 6px 0; }
#menu button {
  padding: 7px 12px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  font-weight: bold;
  color: #fff;
  background: linear-gradient(90deg, #7a05ff, #00e5ff);
  transition: transform 0.12s, filter 0.12s;
}
#menu button:hover { transform: scale(1.05); filter: brightness(1.15); }
#menu button.secondary { background: rgba(255,255,255,0.12); }
#status {
  margin-top: 6px;
  font-size: 12px;
  color: #ff0;
  min-height: 14px;
  word-break: break-all;
}
#roomlist {
  margin-top: 4px;
  max-height: 120px;
  overflow-y: auto;
}
.rl-item {
  display: flex;
  justify-content: space-between;
  padding: 5px 8px;
  border-radius: 6px;
  background: rgba(255,255,255,0.06);
  margin: 3px 0;
  cursor: pointer;
}
.rl-item:hover { background: rgba(0,255,255,0.15); }
#chatwin { margin-top: 10px; border-top: 1px solid rgba(0,255,255,0.2); padding-top: 6px; }
#chatmsgs {
  height: 110px;
  overflow-y: auto;
  font-size: 12px;
  line-height: 1.45;
  margin-bottom: 6px;
}
#chatmsgs .sys { color: #f0f; }
#chatmsgs .nm { color: #0ff; font-weight: bold; }
#chat-input { width: 100%; }
#opponents {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 150px;
}
.opp {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 6px;
}
.opp-flash { animation: oppflash 0.5s; }
@keyframes oppflash {
  0% { box-shadow: 0 0 26px rgba(255,255,100,0.95); background: rgba(255,255,120,0.35); }
  100% { box-shadow: none; background: rgba(255,255,255,0.06); }
}
.opp .nick { font-size: 14px; color: #0ff; text-shadow: 0 0 8px rgba(0,255,255,0.8); margin-bottom: 4px; text-align: center; font-weight: bold; }
.opp canvas { display: block; margin: 0 auto; background: #0f0f3a; border-radius: 4px; }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div id="scanlines"></div>
<div id="bar-ar"></div>

<div id="vignette"></div>
<div id="menu">
  <div style="font-weight:bold;color:#0ff;letter-spacing:2px;">МУЛЬТИПЛЕЕР</div>
  <label>Никнейм</label>
  <input type="text" id="nick" maxlength="16" placeholder="Твой ник">
  <div class="row">
    <button id="btn-create">Создать комнату</button>
  </div>
  <div class="mrow">
    <input type="text" id="room-code" maxlength="6" placeholder="Код комнаты">
    <button id="btn-join">Зайти</button>
  </div>
  <button class="secondary" id="btn-refresh" style="width:100%">Обновить список комнат</button>
  <div id="roomlist"></div>
  <div id="status">Не подключён</div>
  <div id="chatwin">
    <div id="chatmsgs"></div>
    <input type="text" id="chat-input" placeholder="Сообщение..." maxlength="200">
  </div>
</div>

<div id="game-wrapper">
  <div id="sidebar">
    <div class="panel">
      <h3>Очки</h3>
      <div class="value" id="score">0</div>
    </div>
    <div class="panel">
      <h3>Уровень</h3>
      <div class="value" id="level">1</div>
    </div>
    <div class="panel">
      <h3>Линии</h3>
      <div class="value" id="lines">0</div>
    </div>
    <div class="panel">
      <h3>Комбо</h3>
      <div class="value" id="combo">0</div>
    </div>
    <div class="panel">
      <h3>Далее</h3>
      <canvas id="next-canvas" width="120" height="120"></canvas>
    </div>
    <div class="panel controls">
      <kbd>←</kbd> <kbd>→</kbd> Движение<br>
      <kbd>↑</kbd> Поворот<br>
      <kbd>↓</kbd> Ускорить<br>
      <kbd>Space</kbd> Сбросить<br>
      <kbd>P</kbd> Пауза
    </div>
  </div>
  <div id="stage">
    <div id="flash"></div>
    <div id="rowflash"></div>
    <div id="textfx"></div>
    <div id="lightning"></div>
    <div id="board-fx"></div>
    <div id="floats"></div>
    <canvas id="board-canvas" width="300" height="600"></canvas>
  </div>
  <div id="opponents"></div>
</div>
<div id="rgbflash"></div>

<div id="overlay">
  <h1>ТЕТРИС</h1>
  <p>ЛЮТАЯ ВЕРСИЯ</p>
  <button class="btn" id="start-btn">ИГРАТЬ</button>
</div>

<div id="go-overlay" style="display:none">
  <h1>ИГРА ОКОНЧЕНА</h1>
  <div class="final-score" id="final-score"></div>
  <div class="combo-hit" id="max-combo"></div>
  <button class="btn" id="restart-btn">ЗАНОВО</button>
</div>

<script>
const COLS = 10, ROWS = 20, BLOCK = 30;
const COLORS = [null, '#00f0f0', '#0040f0', '#f0a000', '#f0f000', '#00f000', '#a000f0', '#f00000'];
const GLOW_COLORS = [null, '0,255,255', '0,64,240', '240,160,0', '240,240,0', '0,240,0', '160,0,240', '240,0,0'];
const SHAPES = [
  null,
  [[1,1,1,1]],
  [[2,0,0],[2,2,2]],
  [[0,0,3],[3,3,3]],
  [[4,4],[4,4]],
  [[0,5,5],[5,5,0]],
  [[0,6,0],[6,6,6]],
  [[7,7,0],[0,7,7]]
];

const canvas = document.getElementById('board-canvas');
const ctx = canvas.getContext('2d');
const ctx2 = document.createElement('canvas').getContext('2d');
ctx2.canvas.width = canvas.width;
ctx2.canvas.height = canvas.height;
const nextCanvas = document.getElementById('next-canvas');
const nextCtx = nextCanvas.getContext('2d');
const stage = document.getElementById('stage');
const wrapper = document.getElementById('game-wrapper');
const flashEl = document.getElementById('flash');
const textEl = document.getElementById('textfx');

let board, piece, nextPiece, score, lines, level, combo, maxCombo, dropCounter, dropInterval, lastTime, animFrame, paused, gameOver;
let locking = false, lockTimer = 0;
const LOCK_DELAY = 300;
let particles = [];
let meteors = [];
let nebulas = [];
let embers = [];
let flevel = 1;
let lastLevel = 1;
let blastDone = false;
let slowmo = 1, slowmoT = 0, freezeT = 0;
let hardDropping = false, hardDropTarget = -1, hardDropTimer = 0;
const HARD_SPEED = 36;
let aboutToBreak = false;
let breakRows = [];
let breakTimer = 0;
let breakTicker = 0;
let partSlow = 1;

// ===== ЗВУК: Web Audio синтезатор =====
let actx = null, masterGain = null, musicOn = false, musicIv = null, musicStep = 0;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = actx.createGain();
    masterGain.gain.value = 0.55;
    masterGain.connect(actx.destination);
  } catch (e) {}
}
function tone(freq, dur, type, vol, when, slide) {
  if (!actx) return;
  const t = actx.currentTime + (when || 0);
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(1, slide), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol || 0.15, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + dur + 0.05);
}
function boom(dur, vol, freq) {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(freq || 160, t);
  o.frequency.exponentialRampToValueAtTime(30, t + dur);
  g.gain.setValueAtTime(vol || 0.5, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + dur + 0.02);
}
function noisew(dur, vol, type, f0, f1) {
  if (!actx) return;
  const t = actx.currentTime;
  const len = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = actx.createBufferSource();
  src.buffer = buf;
  const filt = actx.createBiquadFilter();
  filt.type = type || 'lowpass';
  filt.frequency.setValueAtTime(f0 || 2000, t);
  if (f1) filt.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = actx.createGain();
  g.gain.setValueAtTime(vol || 0.4, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(filt); filt.connect(g); g.connect(masterGain);
  src.start(t);
}
const sfx = {
  move() { tone(260, 0.05, 'square', 0.07); },
  rotate() { tone(320, 0.06, 'square', 0.1); tone(500, 0.05, 'triangle', 0.08, 0.02); },
  soft() { tone(200, 0.04, 'sine', 0.05); },
  lock() { noisew(0.12, 0.2, 'lowpass', 1000, 150); boom(0.16, 0.35, 150); },
  hard() { noisew(0.4, 0.45, 'bandpass', 250, 3500); tone(1000, 0.22, 'sawtooth', 0.12, 0, 90); boom(0.25, 0.35, 110); },
  line(n) {
    if (!n) return;
    for (let i = 0; i < n; i++) tone(330 * Math.pow(1.25, i), 0.12, 'square', 0.12, i * 0.07);
    if (n >= 2) { noisew(0.18, 0.3, 'highpass', 700, 3200); boom(0.3, 0.35, 90); }
    if (n === 4) { noisew(0.7, 0.5, 'bandpass', 150, 2800); boom(0.9, 0.7, 220); tone(880, 0.5, 'sawtooth', 0.16, 0, 1320); }
  },
  combo(c) { tone(550 + c * 60, 0.12, 'triangle', 0.16); },
  level() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 'triangle', 0.16, i * 0.09)); },
  over() { [392, 330, 262, 196, 147].forEach((f, i) => tone(f, 0.42, 'sawtooth', 0.16, i * 0.18)); noisew(0.9, 0.3, 'lowpass', 1400, 90); }
};
function startMusic() {
  if (!actx || musicOn) return;
  musicOn = true;
  musicStep = 0;
  musicIv = setInterval(musicTick, 150);
}
function stopMusic() {
  musicOn = false;
  if (musicIv) { clearInterval(musicIv); musicIv = null; }
}
function musicTick() {
  if (!actx) { musicIv = null; return; }
  const lv = (typeof level === 'number' && level >= 1) ? level : 1;
  const iv = Math.max(70, 140 - (lv - 1) * 3);
  clearInterval(musicIv);
  musicIv = setInterval(musicTick, iv);
  const s8 = musicStep % 8;
  if (s8 === 0 || s8 === 4) boom(0.2, 0.4, 135);
  if (s8 % 2 === 1) noisew(0.03, 0.05, 'highpass', 6000, 9000);
  if (s8 === 0) {
    const root = 55 * Math.pow(2, (musicStep >> 4) % 2);
    tone(root, 0.16, 'sawtooth', 0.12, 0, root);
  }
  if (lv >= 3 && s8 === 5) tone(550, 0.1, 'square', 0.07);
  if (lv >= 6 && s8 === 3) tone(1100, 0.08, 'square', 0.05);
  musicStep++;
}

function spawnHardTrail() {
  for (let r = 0; r < piece.shape.length; r++)
    for (let c = 0; c < piece.shape[r].length; c++)
      if (piece.shape[r][c] && piece.y + r >= 0 && piece.y + r < ROWS) {
        const tx = (piece.x + c) * BLOCK;
        const ty = (piece.y + r) * BLOCK;
        afterimage(tx, ty, GLOW_COLORS[piece.id]);
        spark(tx + BLOCK / 2, ty + BLOCK / 2, GLOW_COLORS[piece.id], 2);
        trail(tx + BLOCK / 2, ty + BLOCK / 2, GLOW_COLORS[piece.id]);
      }
  if (Math.random() < 0.4) {
    for (let i = 0; i < 8; i++) {
      particles.push({
        x: (piece.x + Math.random() * piece.shape[0].length) * BLOCK,

function finishHardDrop() {
  for (let r = 0; r < piece.shape.length; r++)
    for (let c = 0; c < piece.shape[r].length; c++)
      if (piece.shape[r][c] && piece.y + r >= 0) {
        const px = (piece.x + c) * BLOCK + BLOCK / 2;
        const py = (piece.y + r) * BLOCK + BLOCK / 2;
        burst(px, py, GLOW_COLORS[piece.id], 6);
        spark(px, py, GLOW_COLORS[piece.id], 3);
      }
  confetti((piece.x + piece.shape[0].length / 2) * BLOCK, piece.y * BLOCK, 40);
  beam((piece.x + 0.5) * BLOCK);
  flashEdge();
  rgbFx();
  sfx.lock();
  merge(board, piece);
  locking = false;
  lockTimer = 0;
  if (!gameOver) {
    let full = 0;
    for (let r = 0; r < ROWS; r++)
      if (board[r].every(v => v !== 0)) full++;
    if (full > 0) {
      beginBreakTease();
      return;
    }
    afterLock();
  }
  shake();
}

function randomPiece() {
  const id = (Math.random() * 7 | 0) + 1;
  const shape = SHAPES[id].map(r => [...r]);
  return { shape, id, x: (COLS - shape[0].length) / 2 | 0, y: 0 };
}

function collides(board, piece) {
  for (let r = 0; r < piece.shape.length; r++)
    for (let c = 0; c < piece.shape[r].length; c++)
      if (piece.shape[r][c]) {
        const nx = piece.x + c, ny = piece.y + r;
        if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
        if (ny >= 0 && board[ny][nx]) return true;
      }
  return false;
}

function merge(board, piece) {
  for (let r = 0; r < piece.shape.length; r++)
    for (let c = 0; c < piece.shape[r].length; c++)
      if (piece.shape[r][c]) {
        if (piece.y + r < 0) { gameOver = true; return; }
        board[piece.y + r][piece.x + c] = piece.id;
      }
}

function removeLines() {
  let cleared = 0;
  const rows = [];
  for (let r = ROWS - 1; r >= 0; r--) {
    if (board[r].every(v => v !== 0)) {
      rows.push(r);
      cleared++;
      board.splice(r, 1);
      board.unshift(new Array(COLS).fill(0));
      r++;
    }
  }
  if (cleared) {
    combo++;
    if (combo > maxCombo) maxCombo = combo;
  } else {
    combo = 0;
  }
  document.getElementById('combo').textContent = combo;
  if (combo > 1) {
    document.getElementById('combo').classList.add('gold');
    textFx('КОМБО x' + combo);
  } else {
    document.getElementById('combo').classList.remove('gold');
  }

  if (cleared) {
    const pts = [0, 100, 300, 500, 800];
    const bonus = (combo > 1) ? combo * 200 : 0;
    const gained = pts[cleared] * level + bonus;
    score += gained;
    lines += cleared;
    level = (lines / 10 | 0) + 1;
    dropInterval = Math.max(50, 1000 - (level - 1) * 80);
    let fy = rows[0];
    const cx = 150, cy = (fy + 0.5) * BLOCK;
    floatScore(cx, cy, '+' + gained, cleared >= 3);
    if (cleared === 4) {
      burst(cx, cy, '255,255,0', 120);
      burst(cx, cy, '255,0,255', 80);
      spark(cx, cy, '255,255,255', 60);
      confetti(cx, cy - 30, 70);
      ring(cx, cy);
      ring(cx, cy);
      textFx('ТЕТРИС!');
      confettiRain(40);
      flashEdge();
      slowmoT = 500;
      rgbFx();
    } else if (cleared === 3) {
      burst(cx, cy, '255,0,255', 80);
      spark(cx, cy, '255,255,0', 40);
      confetti(cx, cy - 20, 50);
      ring(cx, cy);
      flashEdge();
    } else if (cleared === 2) {
      burst(cx, cy, '0,255,255', 50);
      spark(cx, cy, '255,255,255', 25);
      confetti(cx, cy - 10, 30);
    } else {
      burst(cx, cy, GLOW_COLORS[4], 30);
      spark(cx, cy, '255,255,255', 15);
    }
    for (const row of rows) {
      for (let i = 0; i < 5; i++) {
        const px = Math.random() * 300;
        spark(px, (row + 0.5) * BLOCK, GLOW_COLORS[4], 6);
      }
    }
    sfx.line(cleared);
    if (combo > 1) sfx.combo(combo);
    if (combo > 2) {
      confetti(cx, cy - 50, combo * 10);
      textFx('КОМБО x' + combo + '!');
      flashEdge();
      const fw = Math.min(combo, 5);
      for (let i = 0; i < fw; i++) setTimeout(firework, i * 90);
      if (combo >= 4) rgbFx();
    }
    if (level > lastLevel) {
      lastLevel = level;
      flevel = level;
      textFx('УРОВЕНЬ ' + level + '!');
      confettiRain(60);
      flashEdge();
      floatScore(150, 200, 'LEVEL ' + level, true);
      document.getElementById('level').style.animation = 'pulse 0.6s';
      sfx.level();
    }
    if (flevel > 1) {
      const bfx = document.getElementById('board-fx');
      bfx.classList.add('intense');
      clearTimeout(bfx._t);
      bfx._t = setTimeout(() => bfx.classList.remove('intense'), 1500);
    }
    flashFx();
    shake();
    canvas.classList.remove('glow');
    void canvas.offsetWidth;
    canvas.classList.add('glow');
  }
}

function rotate(piece) {
  const prevBoard = board.map(r => [...r]);
  const shape = piece.shape;
  const rotated = shape[0].map((_, i) => shape.map(r => r[i]).reverse());
  const prev = piece.shape;
  piece.shape = rotated;
  if (collides(board, piece)) {
    piece.shape = prev;
  }
  void prevBoard;
}

function drawBlock(context, x, y, color, size, glow) {
  context.fillStyle = color;
  context.fillRect(x * size, y * size, size, size);
  context.fillStyle = 'rgba(255,255,255,0.2)';
  context.fillRect(x * size, y * size, size, 2);
  context.fillRect(x * size, y * size, 2, size);
  context.fillStyle = 'rgba(0,0,0,0.25)';
  context.fillRect(x * size + size - 2, y * size, 2, size);
  context.fillRect(x * size, y * size + size - 2, size, 2);
  if (glow) {
    context.fillStyle = 'rgba(255,255,255,0.18)';
    context.fillRect(x * size + size * 0.3, y * size + size * 0.3, size * 0.4, size * 0.4);
  }
}

function draw() {
  if (!board) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#0f0f3a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (board[r][c]) drawBlock(ctx, c, r, COLORS[board[r][c]], BLOCK, 'rgba(' + GLOW_COLORS[board[r][c]] + ',0.6)');

  if (piece) {
    if (hardDropping) {
      ctx.globalAlpha = 0.35;
      ctx.lineWidth = 2;
      for (let c = 0; c < piece.shape[0].length; c++) {
        const lx = (piece.x + c) * BLOCK + BLOCK / 2;
        ctx.strokeStyle = 'rgba(' + GLOW_COLORS[piece.id] + ',0.8)';
        ctx.beginPath();
        ctx.moveTo(lx, 0);
        ctx.lineTo(lx, canvas.height);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    const ghost = { shape: piece.shape.map(r => [...r]), x: piece.x, y: piece.y };
    while (!collides(board, ghost)) ghost.y++;
    ghost.y--;
    for (let r = 0; r < ghost.shape.length; r++)
      for (let c = 0; c < ghost.shape[r].length; c++)
        if (ghost.shape[r][c] && ghost.y + r >= 0 && ghost.y + r < ROWS) {
          ctx.globalAlpha = 0.2;
          ctx.fillStyle = COLORS[piece.id];
          ctx.fillRect((ghost.x + c) * BLOCK, (ghost.y + r) * BLOCK, BLOCK, BLOCK);
          ctx.globalAlpha = 1;
        }
    const flash = locking ? (0.3 + 0.7 * Math.abs(Math.sin(Date.now() * 0.012))) : 1;
    for (let r = 0; r < piece.shape.length; r++)
      for (let c = 0; c < piece.shape[r].length; c++)
        if (piece.shape[r][c] && piece.y + r >= 0) {
          drawBlock(ctx, piece.x + c, piece.y + r, COLORS[piece.id], BLOCK, 'rgba(' + GLOW_COLORS[piece.id] + ',0.8)');
          if (locking) {
            ctx.globalAlpha = 0.3 * flash;
            ctx.fillStyle = '#fff';
            ctx.fillRect((piece.x + c) * BLOCK, (piece.y + r) * BLOCK, BLOCK, BLOCK);
            ctx.globalAlpha = 1;
          }
        }
    if (locking && lockTimer > 50) {
      const progress = Math.min(1, lockTimer / LOCK_DELAY);
      ctx.strokeStyle = 'rgba(255,80,80,' + (0.5 + 0.5 * progress) + ')';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      for (let r = 0; r < piece.shape.length; r++)
        for (let c = 0; c < piece.shape[r].length; c++)
          if (piece.shape[r][c] && piece.y + r >= 0) {
            ctx.strokeRect((piece.x + c) * BLOCK + 1, (piece.y + r) * BLOCK + 1, BLOCK - 2, BLOCK - 2);
          }
      ctx.setLineDash([]);
    }
  }

  nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
  if (nextPiece) {
    const s = 24;
    const ox = (nextCanvas.width - nextPiece.shape[0].length * s) / 2;
    const oy = (nextCanvas.height - nextPiece.shape.length * s) / 2;
    nextCtx.shadowColor = 'rgba(' + GLOW_COLORS[nextPiece.id] + ',0.8)';
    nextCtx.shadowBlur = 10;
    for (let r = 0; r < nextPiece.shape.length; r++)
      for (let c = 0; c < nextPiece.shape[r].length; c++)
        if (nextPiece.shape[r][c]) {
          nextCtx.fillStyle = COLORS[nextPiece.id];
          nextCtx.fillRect(ox + c * s, oy + r * s, s, s);
          nextCtx.fillStyle = 'rgba(255,255,255,0.2)';
          nextCtx.fillRect(ox + c * s, oy + r * s, s, 2);
          nextCtx.fillRect(ox + c * s, oy + r * s, 2, s);
        }
    nextCtx.shadowBlur = 0;
  }

  document.getElementById('score').textContent = score;
  document.getElementById('level').textContent = level;
  document.getElementById('lines').textContent = lines;
  if (!document.getElementById('score').classList.contains('pulse-ref')) {
    document.getElementById('score').classList.add('pulse-ref');
  }
}

function drawParticles(ctx) {
  ctx.globalCompositeOperation = 'lighter';
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * partSlow;
    p.y += p.vy * partSlow;
    p.life -= p.decay * partSlow;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = Math.max(0, p.life);
    switch (p.type) {
      case 1:
        p.vy += 0.12 * partSlow;
        p.vx *= 0.99;
        ctx.fillStyle = 'rgba(' + p.color + ',' + p.life + ')';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 2:
        p.vy += 0.04 * partSlow;
        ctx.strokeStyle = 'rgba(' + p.color + ',' + p.life + ')';
        ctx.lineWidth = p.size;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 2, p.y - p.vy * 2);
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.globalAlpha = p.life * 0.8;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 3:
        p.vy += 0.02 * partSlow;
        p.vx *= 0.998;
        p.rot = (p.rot || 0) + (p.vr || 0) * partSlow;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = 'rgba(' + p.color + ',' + p.life + ')';
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
        break;
      case 4:
        p.radius += p.growth * partSlow;
        ctx.strokeStyle = 'rgba(' + p.color + ',' + p.life + ')';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.stroke();
        break;
      case 5:
        p.vy += 0.005 * partSlow;
        p.vx *= 0.98;
        ctx.globalAlpha = Math.max(0, p.life * 0.6);
        ctx.fillStyle = 'rgba(' + p.color + ',1)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life * 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 6:
        ctx.save();
        ctx.globalAlpha = p.life * 0.5;
        const grad = ctx.createLinearGradient(0, 0, 0, 600);
        grad.addColorStop(0, 'rgba(255,255,0,0)');
        grad.addColorStop(0.3, 'rgba(255,255,0,' + (0.8 * p.life) + ')');
        grad.addColorStop(0.7, 'rgba(255,255,0,' + (0.8 * p.life) + ')');
        grad.addColorStop(1, 'rgba(255,255,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(p.x0 - 16, 0, 32, 600);
        ctx.strokeStyle = 'rgba(255,255,255,' + p.life + ')';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(p.x0 - 16, 0);
        ctx.lineTo(p.x0 - 16, 600);
        ctx.moveTo(p.x0 + 16, 0);
        ctx.lineTo(p.x0 + 16, 600);
        ctx.stroke();
        ctx.restore();
        break;
      case 7:
        ctx.fillStyle = 'rgba(' + p.color + ',' + (p.life * 0.28) + ')';
        ctx.fillRect(p.x - 3, p.y - 3, BLOCK + 6, BLOCK + 6);
        ctx.fillStyle = 'rgba(' + p.color + ',' + (p.life * 0.55) + ')';
        ctx.fillRect(p.x, p.y, BLOCK, BLOCK);
        break;
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

function drop() {
  if (locking) return;
  piece.y++;
  if (collides(board, piece)) {
    piece.y--;
    startLock();
  }
  dropCounter = 0;
}

function startLock() {
  if (locking) return;
  locking = true;
  lockTimer = 0;
  ring((piece.x + piece.shape[0].length / 2) * BLOCK, (piece.y + piece.shape.length) * BLOCK, GLOW_COLORS[piece.id]);
  sfx.lock();
  hitPunch();
}

function lockPlace() {
  locking = false;
  lockTimer = 0;
  let hit = false;
  for (let r = 0; r < piece.shape.length; r++)
    for (let c = 0; c < piece.shape[r].length; c++)
      if (piece.shape[r][c] && piece.y + r >= 0) {
        trail((piece.x + c) * BLOCK + BLOCK / 2, (piece.y + r) * BLOCK + BLOCK / 2, GLOW_COLORS[piece.id]);
        if (!hit) { hit = true; spark((piece.x + c) * BLOCK + BLOCK / 2, (piece.y + r) * BLOCK + BLOCK / 2, GLOW_COLORS[piece.id], 6); }
      }
  merge(board, piece);
  if (gameOver) return;
  let full = 0;
  for (let r = 0; r < ROWS; r++)
    if (board[r].every(v => v !== 0)) full++;
  if (full > 0) {
    beginBreakTease();
    return;
  }
  afterLock();
}

function afterLock() {
  piece = nextPiece;
  nextPiece = randomPiece();
  dropCounter = 0;
  if (collides(board, piece)) {
    gameOver = true;
  }
}

function beginBreakTease() {
  breakRows = [];
  for (let r = 0; r < ROWS; r++)
    if (board[r].every(v => v !== 0)) breakRows.push(r);
  aboutToBreak = true;
  breakTicker = 0;
  const n = breakRows.length;
  breakTimer = 720 + n * 160;
  slowmoT = breakTimer + 260;
  freezeT = 50 + n * 20;
  stage.style.transition = 'none';
  const rowFlash = document.getElementById('rowflash');
  rowFlash.style.top = (breakRows[0] * BLOCK - 1) + 'px';
  rowFlash.style.height = (n * BLOCK + 2) + 'px';
  try { if (musicOn) boom(0.4, 0.3, 130); } catch (e) { }
}

function tickBreakFx(realDt) {
  const rowFlash = document.getElementById('rowflash');
  const vign = document.getElementById('vignette');
  const total = 720 + breakRows.length * 160;
  const elapsed = total - breakTimer;
  const frac = Math.min(1, elapsed / total);
  const n = breakRows.length;
  const cx = 160, cy = (breakRows[0] + 0.5) * BLOCK;
  const wob = Math.sin(elapsed * 0.055) * (0.11 + n * 0.05) * frac;
  const s = 1.18 + wob + frac * frac * 0.55;
  const rot = Math.sin(elapsed * 0.08) * (1.1 + n * 0.5) * frac;
  const jx = (Math.random() - 0.5) * (2 + frac * 26);
  const jy = (Math.random() - 0.5) * (2 + frac * 26);
  stage.style.transformOrigin = cx + 'px ' + cy + 'px';
  stage.style.transform = 'translate(' + jx + 'px,' + jy + 'px) rotate(' + rot + 'deg) scale(' + s + ')';
  stage.style.filter = 'hue-rotate(' + (Math.sin(elapsed * 0.02) * 45 * frac) + 'deg) saturate(' + (1.2 + Math.sin(elapsed * 0.05) * 0.55) + ') brightness(' + (1 + 0.25 * Math.sin(elapsed * 0.06)) + ')';
  rowFlash.style.opacity = 0.3 + 0.5 * Math.abs(Math.sin(elapsed * 0.06));
  vign.style.opacity = Math.min(0.9, frac * 1.2);
  breakTicker += realDt;
  if (actx && musicOn && breakTicker > 115) {
    tone(170 + frac * 780, 0.07, 'square', 0.04, 0, 170 + frac * 1050);
    breakTicker = 0;
  }
  if (Math.random() < 0.5) {
    spark(cx + (Math.random() - 0.5) * 280, cy + (Math.random() - 0.5) * 60, '255,255,0', 2);
    if (Math.random() < 0.4) ring(cx + (Math.random() - 0.5) * 240, cy, '255,255,0');
  }
}

function performBreak() {
  const n = breakRows.length;
  const cy = (breakRows[0] + 0.5) * BLOCK;
  document.getElementById('rowflash').style.opacity = 0;
  const vign = document.getElementById('vignette');
  vign.style.opacity = 0;
  stage.style.transition = 'transform 70ms ease-out';
  stage.style.transformOrigin = '150px ' + cy + 'px';
  stage.style.transform = 'rotate(3deg) scale(1.75)';
  stage.style.filter = 'hue-rotate(140deg) saturate(2.6) brightness(1.6)';
  flashFx();
  flashEdge();
  shake();
  if (n >= 3) rgbFx();
  try { if (musicOn) { boom(0.55, 0.6, 80); noisew(0.3, 0.35); } } catch (e) { }
  removeLines();
  afterLock();
  setTimeout(() => {
    vign.style.transition = 'opacity 300ms ease-out';
    setTimeout(() => { vign.style.transition = ''; }, 320);
    stage.style.transition = 'transform 320ms cubic-bezier(.2,.9,.3,1.6), filter 320ms ease-out';
    stage.style.transform = 'scale(1)';
    stage.style.filter = '';
    setTimeout(() => {
      stage.style.transition = '';
      stage.style.transform = '';
      stage.style.transformOrigin = '';
    }, 340);
  }, 70);
}

function update(time = 0) {
  if (gameOver) {
    if (!blastDone) {
      blastDone = true;
      sfx.over();
      gameOverBlast();
      setTimeout(gameOverBlast, 400);
      rgbFx();
    }
    draw();
    drawParticles(ctx);
    document.getElementById('final-score').textContent = 'Очки: ' + score;
    document.getElementById('max-combo').textContent = 'Макс. комбо: x' + maxCombo;
    const go = document.getElementById('go-overlay');
    go.classList.remove('hidden');
    go.style.display = 'flex';
    animFrame = requestAnimationFrame(update);
    return;
  }
  if (!paused) {
    let dt = time - lastTime;
    lastTime = time;
    const realDt = dt;
    if (freezeT > 0) {
      freezeT -= realDt;
      dt = 0;
    } else if (slowmoT > 0) {
      slowmoT -= realDt;
      dt *= 0.16;
    }
    partSlow = (freezeT > 0) ? 0 : (slowmoT > 0 ? 0.18 : 1);
    if (aboutToBreak) {
      breakTimer -= realDt;
      if (breakTimer <= 0) {
        aboutToBreak = false;
        performBreak();
        if (gameOver) { draw(); drawParticles(ctx); }
      } else {
        tickBreakFx(realDt);
      }
    } else if (hardDropping) {
      hardDropTimer += dt;
      while (hardDropTimer >= HARD_SPEED && piece.y < hardDropTarget) {
        piece.y++;
        hardDropTimer -= HARD_SPEED;
        spawnHardTrail();
      }
      if (piece.y >= hardDropTarget || hardDropTimer > 4000) {
        hardDropping = false;
        finishHardDrop();
        if (gameOver) { draw(); drawParticles(ctx); }
      }
    } else if (locking) {
      lockTimer += dt;
      if (lockTimer >= LOCK_DELAY) {
        lockPlace();
        if (gameOver) { draw(); drawParticles(ctx); }
      }
    } else {
      dropCounter += dt;
      if (dropCounter > dropInterval) drop();
    }
    if (piece && !aboutToBreak && !locking && dropCounter > 300 && Math.random() < 0.2) {
      for (let r = 0; r < piece.shape.length; r++)
        for (let c = 0; c < piece.shape[r].length; c++)
          if (piece.shape[r][c] && piece.y + r >= 0 && Math.random() < 0.25)
            trail((piece.x + c) * BLOCK + BLOCK / 2, (piece.y + r) * BLOCK + BLOCK / 2, GLOW_COLORS[piece.id]);
    }
    if (particles.length > 700) particles.splice(0, particles.length - 700);
    if (Math.random() < 0.12) {
      const a = Math.random() * Math.PI * 2;
      embers.push({
        x: 150 + Math.cos(a) * 170,
        y: 620 + Math.random() * 20,
        r: 1 + Math.random() * 2.5,
        vy: -(0.5 + Math.random() * 1.2),
        vx: Math.sin(a) * 0.4
      });
    }
    draw();
    drawParticles(ctx);
    for (let i = embers.length - 1; i >= 0; i--) {
      const e = embers[i];
      e.x += e.vx * partSlow; e.y += e.vy * partSlow;
      if (e.y < -10) { embers.splice(i, 1); continue; }
      const a = Math.min(0.9, (620 - e.y) / 300);
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(255,200,80,0.5)';
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r * 2.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(255,230,150,1)';
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r * (0.6 + (1 - e.y / 630)), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    document.getElementById('score').classList.toggle('pulse', false);
  }
  window.__sf = (window.__sf || 0) + 1;
  if (window.__sf % 3 === 0) sendState();
  drawOpps();
  animFrame = requestAnimationFrame(update);
}

function startGame() {
  board = createBoard();
  score = 0; lines = 0; level = 1; combo = 0; maxCombo = 0;
  dropCounter = 0;
  dropInterval = 1000;
  lastTime = performance.now();
  paused = false;
  gameOver = false;
  locking = false;
  lockTimer = 0;
  lastLevel = 1;
  flevel = 1;
  blastDone = false;
  slowmo = 1; slowmoT = 0; freezeT = 0;
  hardDropping = false;
  hardDropTarget = -1;
  hardDropTimer = 0;
  aboutToBreak = false;
  breakRows = [];
  breakTimer = 0;
  document.getElementById('rowflash').style.opacity = 0;
  document.getElementById('vignette').style.opacity = 0;
  stage.style.transition = '';
  stage.style.transform = '';
  stage.style.filter = '';
  stage.style.transformOrigin = '';
  musicStep = 0;
  particles = [];
  meteors = [];
  embers = [];
  nebulas = [];
  piece = randomPiece();
  nextPiece = randomPiece();

  document.getElementById('overlay').classList.add('hidden');
  const go = document.getElementById('go-overlay');
  go.classList.add('hidden');
  go.style.display = 'none';

  if (animFrame) cancelAnimationFrame(animFrame);
  animFrame = requestAnimationFrame(update);
}

document.addEventListener('keydown', e => {
  if (gameOver) return;
  initAudio();
  if (!musicOn && typeof level === 'number') startMusic();
  if (e.key === 'p' || e.key === 'P' || e.key === 'з' || e.key === 'З') {
    paused = !paused;
    if (!paused) { lastTime = performance.now(); animFrame = requestAnimationFrame(update); }
    return;
  }
  if (paused) return;
  if (hardDropping) { e.preventDefault(); return; }
  const onMove = () => {
    if (locking) {
      if (collides(board, piece)) {
        lockTimer = 0;
      } else {
        locking = false;
        lockTimer = 0;
        dropCounter = 0;
      }
    }
  };
  switch (e.key) {
    case 'ArrowLeft':
      piece.x--;
      if (collides(board, piece)) piece.x++;
      if (!collides(board, piece)) { onMove(); sfx.move(); }
      e.preventDefault();
      break;
    case 'ArrowRight':
      piece.x++;
      if (collides(board, piece)) piece.x--;
      if (!collides(board, piece)) { onMove(); sfx.move(); }
      e.preventDefault();
      break;
    case 'ArrowDown':
      drop();
      sfx.soft();
      e.preventDefault();
      break;
    case 'ArrowUp':
      rotate(piece);
      onMove();
      sfx.rotate();
      e.preventDefault();
      break;
    case ' ':
      if (hardDropping) { e.preventDefault(); break; }
      let target = piece.y;
      while (!collides(board, { shape: piece.shape, x: piece.x, y: target + 1 })) target++;
      hardDropTarget = target;
      hardDropTimer = 0;
      hardDropping = true;
      sfx.hard();
      rgbFx();
      e.preventDefault();
      break;
  }
  draw();
});

document.getElementById('start-btn').addEventListener('click', () => {
  initAudio();
  startMusic();
  startGame();
});
document.getElementById('restart-btn').addEventListener('click', () => {
  initAudio();
  startMusic();
  startGame();
});

// ===== МУЛЬТИПЛЕЕР: WebSocket, комнаты, ники, чат, соперники =====
let ws = null;
let myNick = '';
let myRoom = null;
let myId = null;
const opps = {};      // id -> { nick, board, piece, score, lines, level, el, ctx }
const oppOrder = [];
const chatBox = document.getElementById('chatmsgs');
const statusEl = document.getElementById('status');
const oppWrap = document.getElementById('opponents');

function wsUrl() {
  const host = location.hostname || '45.143.93.41';
  return 'ws://' + host + ':8283';
}

function connectWs() {
  if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
  try { ws = new WebSocket(wsUrl()); } catch (e) { return; }
  statusEl.textContent = 'Подключение...';
  ws.onopen = () => {
    statusEl.textContent = 'Онлайн';
    sendMsg({ type: 'list' });
  };
  ws.onclose = () => {
    statusEl.textContent = 'Отключён';
    ws = null;
    myRoom = null;
  };
  ws.onmessage = ev => {
    let d;
    try { d = JSON.parse(ev.data); } catch (e) { return; }
    handleMsg(d);
  };
}

function sendMsg(obj) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
}

function addChat(nick, text, sys) {
  const line = document.createElement('div');
  if (sys) {
    line.className = 'sys';
    line.textContent = text;
  } else {
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = nick + ': ';
    line.appendChild(nm);
    line.appendChild(document.createTextNode(text));
  }
  chatBox.appendChild(line);
  chatBox.scrollTop = chatBox.scrollHeight;
  while (chatBox.children.length > 120) chatBox.removeChild(chatBox.firstChild);
}

function handleMsg(d) {
  switch (d.type) {
    case 'joined':
      myRoom = d.room;
      myId = d.you;
      statusEl.textContent = 'В комнате ' + d.room;
      for (const k of Object.keys(opps)) removeOpp(k);
      sendMsg({ type: 'list' });
      break;
    case 'err':
      statusEl.textContent = d.msg;
      break;
    case 'rooms':
      renderRooms(d.rooms);
      break;
    case 'room':
      if (myRoom && d.code === myRoom) {
        const names = d.players.map(p => p.nick).join(', ');
        statusEl.textContent = 'Комната ' + d.code + ' (' + d.players.length + '): ' + names;
      }
      break;
    case 'chat':
      addChat(d.nick, d.msg, d.nick === '*');
      break;
    case 'state':
      if (d.id !== myId) {
        let o = opps[d.id];
        if (!o) {
          o = { nick: d.nick, board: null, piece: null, score: 0, lines: 0, level: 1, el: null, ctx: null };
          opps[d.id] = o;
          oppOrder.push(d.id);
          pruneOpps();
          buildOppEl(o);
        }
        const prevLines = o.lines;
        const prevOver = o.over;
        o.nick = d.nick;
        o.board = d.board;
        o.piece = d.piece;
        o.score = d.score || 0;
        o.lines = d.lines || 0;
        o.level = d.level || 1;
        if (o.piece) {
          o.piece.gy = (d.gy == null) ? o.piece.y : d.gy;
          o.t = { x: o.piece.x, y: o.piece.y };
        } else {
          o.t = null;
        }
        if (!prevOver && d.over) {
          o.over = performance.now();
          if (myRoom) textFx(o.nick + ' ПРОИГРАЛ!');
        }
        if (d.lines > prevLines) {
          const delta = d.lines - prevLines;
          o.flashT = performance.now() + 450;
          o.el.classList.remove('opp-flash');
          void o.el.offsetWidth;
          o.el.classList.add('opp-flash');
          if (delta >= 4 && myRoom) textFx(o.nick + ' — ТЕТРИС!');
        }
      }
      break;
  }
}

function renderRooms(list) {
  const rl = document.getElementById('roomlist');
  rl.innerHTML = '';
  if (!list.length) {
    rl.innerHTML = '<div style="color:#666;font-size:11px;padding:4px">Комнат пока нет</div>';
    return;
  }
  for (const r of list) {
    const it = document.createElement('div');
    it.className = 'rl-item';
    it.innerHTML = '<span style="color:#0ff;font-weight:bold">#' + r.code + '</span><span style="color:#aaa">' + r.players + '/8</span>';
    it.onclick = () => {
      document.getElementById('room-code').value = r.code;
      joinRoom(r.code);
    };
    rl.appendChild(it);
  }
}

function pruneOpps() {
  while (oppOrder.length > 4) {
    const old = oppOrder.shift();
    removeOpp(old);
  }
}

function buildOppEl(o) {
  o.el = document.createElement('div');
  o.el.className = 'opp';
  const nickH = document.createElement('div');
  nickH.className = 'nick';
  nickH.textContent = o.nick;
  o.nickEl = nickH;
  const cv = document.createElement('canvas');
  cv.width = 120;
  cv.height = 240;
  o.ctx = cv.getContext('2d');
  o.el.appendChild(nickH);
  o.el.appendChild(cv);
  oppWrap.appendChild(o.el);
}

function removeOpp(id) {
  const o = opps[id];
  if (o && o.el && o.el.parentNode) o.el.parentNode.removeChild(o.el);
  delete opps[id];
  const i = oppOrder.indexOf(id);
  if (i >= 0) oppOrder.splice(i, 1);
}

const OPP_CELL = 12;
const OPP_W = 120;
const OPP_H = 240;
function drawOpps() {
  const now = performance.now();
  for (const id of oppOrder) {
    const o = opps[id];
    if (!o || !o.ctx) continue;
    const cx = o.ctx;
    cx.clearRect(0, 0, OPP_W, OPP_H);
    cx.fillStyle = '#0d0d38';
    cx.fillRect(0, 0, OPP_W, OPP_H);
    cx.strokeStyle = 'rgba(0,255,255,0.05)';
    cx.lineWidth = 1;
    cx.beginPath();
    for (let g = 1; g < 10; g++) { cx.moveTo(g * OPP_CELL, 0); cx.lineTo(g * OPP_CELL, OPP_H); }
    for (let g = 1; g < 20; g++) { cx.moveTo(0, g * OPP_CELL); cx.lineTo(OPP_W, g * OPP_CELL); }
    cx.stroke();
    if (o.board) {
      for (let r = 0; r < 20; r++)
        for (let c = 0; c < 10; c++) {
          const v = o.board[r] && o.board[r][c];
          if (!v) continue;
          cx.fillStyle = COLORS[v] || '#fff';
          cx.fillRect(c * OPP_CELL + 1, r * OPP_CELL + 1, OPP_CELL - 2, OPP_CELL - 2);
          cx.fillStyle = 'rgba(255,255,255,0.18)';
          cx.fillRect(c * OPP_CELL + 1, r * OPP_CELL + 1, OPP_CELL - 2, 2);
          cx.fillStyle = 'rgba(0,0,0,0.2)';
          cx.fillRect(c * OPP_CELL + 1, r * OPP_CELL + OPP_CELL - 3, OPP_CELL - 2, 2);
        }
    }
    if (o.piece && o.piece.shape) {
      const sh = o.piece.shape;
      const p = o.piece;
      if (o.lastId !== p.id) {
        o.lastId = p.id;
        o.px = p.x;
        o.py = p.y;
        o.pgy = (p.gy != null) ? p.gy : p.y;
      } else if (o.t) {
        o.px += (o.t.x - o.px) * 0.22;
        o.py += (o.t.y - o.py) * 0.22;
        if (p.gy != null) o.pgy += (p.gy - o.pgy) * 0.22;
      }
      const py = o.py;
      const px = o.px;
      const gy = o.pgy;
      if (p.gy != null) {
        cx.globalAlpha = 0.22;
        for (let r = 0; r < sh.length; r++)
          for (let c = 0; c < sh[r].length; c++)
            if (sh[r][c]) {
              cx.fillStyle = COLORS[p.id] || '#fff';
              cx.fillRect((px + c) * OPP_CELL, (gy + r) * OPP_CELL, OPP_CELL, OPP_CELL);
            }
        cx.globalAlpha = 1;
      }
      cx.save();
      cx.globalCompositeOperation = 'lighter';
      cx.fillStyle = (COLORS[p.id] || '#fff') + '50';
      for (let r = 0; r < sh.length; r++)
        for (let c = 0; c < sh[r].length; c++)
          if (sh[r][c]) cx.fillRect((px + c) * OPP_CELL, (py + r) * OPP_CELL, OPP_CELL, OPP_CELL);
      cx.restore();
      for (let r = 0; r < sh.length; r++)
        for (let c = 0; c < sh[r].length; c++)
          if (sh[r][c]) {
            cx.fillStyle = COLORS[p.id] || '#fff';
            cx.fillRect((px + c) * OPP_CELL + 1, (py + r) * OPP_CELL + 1, OPP_CELL - 2, OPP_CELL - 2);
            cx.fillStyle = 'rgba(255,255,255,0.3)';
            cx.fillRect((px + c) * OPP_CELL + 1, (py + r) * OPP_CELL + 1, OPP_CELL - 2, 2);
          }
    }
    if (o.flashT && now < o.flashT) {
      const a = (o.flashT - now) / 450;
      cx.fillStyle = 'rgba(255,255,255,' + (a * 0.45) + ')';
      cx.fillRect(0, 0, OPP_W, OPP_H);
      cx.strokeStyle = 'rgba(255,255,255,' + (a * 0.9) + ')';
      cx.lineWidth = 3;
      cx.strokeRect(0, 0, OPP_W, OPP_H);
    }
    if (o.over) {
      cx.fillStyle = 'rgba(0,0,0,0.55)';
      cx.fillRect(0, 0, OPP_W, OPP_H);
      cx.fillStyle = '#ff4444';
      cx.font = 'bold 13px monospace';
      cx.textAlign = 'center';
      cx.fillText('GAME OVER', OPP_W / 2, OPP_H / 2 - 4);
      cx.fillStyle = '#fff';
      cx.font = '10px monospace';
      cx.fillText(o.score + ' очков', OPP_W / 2, OPP_H / 2 + 14);
    }
    if (o.nickEl) o.nickEl.textContent = o.nick + ' · ' + o.score;
  }
}

function sendState() {
  if (!ws || !myRoom || ws.readyState !== 1) return;
  if (!board) return;
  if (!piece) return;
  let gy = piece.y;
  while (!collides(piece, gy + 1)) gy++;
  sendMsg({
    type: 'state',
    board: board,
    piece: { shape: piece.shape, x: piece.x, y: piece.y, id: piece.id },
    gy: gy,
    score: score,
    lines: lines,
    level: level,
    over: gameOver ? 1 : 0,
  });
}

function joinRoom(code) {
  const nick = (document.getElementById('nick').value || 'player').trim().slice(0, 16) || 'player';
  myNick = nick;
  connectWs();
  setTimeout(() => sendMsg({ type: 'join', nick: nick, room: code }), 200);
}

function createRoom() {
  const nick = (document.getElementById('nick').value || 'player').trim().slice(0, 16) || 'player';
  myNick = nick;
  connectWs();
  setTimeout(() => sendMsg({ type: 'create', nick: nick }), 200);
}

document.getElementById('btn-create').addEventListener('click', createRoom);
document.getElementById('btn-join').addEventListener('click', () => {
  joinRoom(document.getElementById('room-code').value.trim());
});
document.getElementById('btn-refresh').addEventListener('click', () => {
  connectWs();
  setTimeout(() => sendMsg({ type: 'list' }), 150);
});
document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.value.trim()) {
    sendMsg({ type: 'chat', msg: e.target.value.trim() });
    e.target.value = '';
    e.preventDefault();
  }
});
connectWs();

// ===== ФОН: звезды, небо, радуга =====
const bg = document.getElementById('bg');
const bgCtx = bg.getContext('2d');
let stars = [];
function resize() {
  bg.width = innerWidth;
  bg.height = innerHeight;
  stars = [];
  const n = Math.min(200, (bg.width * bg.height) / 5000 | 0);
  for (let i = 0; i < n; i++) {
    stars.push({
      x: Math.random() * bg.width,
      y: Math.random() * bg.height,
      r: Math.random() * 1.8 + 0.3,
      tw: Math.random() * Math.PI * 2,
      sp: 0.005 + Math.random() * 0.02
    });
  }
}
addEventListener('resize', resize);
resize();

let hue = 0;
function spawnMeteor() {
  meteors.push({
    x: Math.random() * bg.width,
    y: Math.random() * bg.height * 0.4,
    vx: (Math.random() * 6 + 3) * (Math.random() < 0.5 ? 1 : -1),
    vy: 2 + Math.random() * 3,
    life: 1,
    decay: 0.004 + Math.random() * 0.003,
    r: 1.5 + Math.random() * 2,
    tw: Math.random() * Math.PI * 2
  });
}
function bgLoop() {
  hue = (hue + 0.8) % 360;
  bgCtx.globalAlpha = 0.12;
  bgCtx.fillStyle = 'hsl(' + hue + ',80%,7%)';
  bgCtx.fillRect(0, 0, bg.width, bg.height);
  bgCtx.globalAlpha = 1;
  for (const s of stars) {
    s.tw += s.sp;
    bgCtx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(s.tw));
    bgCtx.fillStyle = '#fff';
    bgCtx.beginPath();
    bgCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    bgCtx.fill();
  }
  if (Math.random() < 0.02 && meteors.length < 5) spawnMeteor();
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.x += m.vx;
    m.y += m.vy;
    m.life -= m.decay;
    m.tw += 0.2;
    if (m.life <= 0 || m.y > bg.height) { meteors.splice(i, 1); continue; }
    bgCtx.globalAlpha = m.life;
    bgCtx.strokeStyle = 'rgba(255,255,255,0.6)';
    bgCtx.lineWidth = m.r;
    bgCtx.beginPath();
    bgCtx.moveTo(m.x - m.vx * 10, m.y - m.vy * 10);
    bgCtx.lineTo(m.x, m.y);
    bgCtx.stroke();
    bgCtx.fillStyle = '#fff';
    bgCtx.beginPath();
    bgCtx.arc(m.x, m.y, m.r * (1 - m.life * 0.3), 0, Math.PI * 2);
    bgCtx.fill();
  }
  if (nebulas.length < 3) {
    nebulas.push({
      x: Math.random() * bg.width,
      y: Math.random() * bg.height,
      r: 80 + Math.random() * 140,
      h: Math.random() * 360,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      phase: Math.random() * Math.PI * 2
    });
  }
  for (let i = nebulas.length - 1; i >= 0; i--) {
    const n = nebulas[i];
    n.x += n.vx; n.y += n.vy;
    n.phase += 0.01;
    n.h = (n.h + 0.3) % 360;
    if (n.x < -n.r * 2) n.x = bg.width + n.r;
    if (n.x > bg.width + n.r * 2) n.x = -n.r;
    if (n.y < -n.r * 2) n.y = bg.height + n.r;
    if (n.y > bg.height + n.r * 2) n.y = -n.r;
    const pulse = 0.5 + 0.5 * Math.sin(n.phase);
    const g = bgCtx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    g.addColorStop(0, 'hsla(' + n.h + ',90%,60%,' + (0.12 * pulse) + ')');
    g.addColorStop(1, 'hsla(' + n.h + ',90%,60%,0)');
    bgCtx.fillStyle = g;
    bgCtx.fillRect(n.x - n.r, n.y - n.r, n.r * 2, n.r * 2);
  }
  bgCtx.globalAlpha = 1;
  requestAnimationFrame(bgLoop);
}
requestAnimationFrame(bgLoop);

draw();

const _origUpdate = update;
update = function(time) {
  try {
    _origUpdate(time);
  } catch (err) {
    if (window.__tetrisErrs === undefined) window.__tetrisErrs = 0;
    window.__tetrisErrs++;
    if (window.__tetrisErrs < 50) requestAnimationFrame(update);
  }
};
</script>
